[package]
name = "amiki"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Amiki2D 通用 2D 渲染引擎（门面 API）"

[features]
default = ["gpu"]

# GPU 路径（wgpu）。**WASM 构建请关掉它** —— 纯 CPU 构建：
#
#     cargo build -p amiki --target wasm32-unknown-unknown --release --no-default-features
#
# 为什么需要这个开关：wgpu 会把 wasm 模块推到 **23 MB**，而 WASM 的主要
# 使用场景是浏览器/边缘运行时，体积是第一约束。纯 CPU 构建只有它的零头。
#
# native 用户**不需要关心它** —— 默认开着，行为与以前完全一致。
gpu = ["dep:amiki-gpu", "dep:pollster"]

[dependencies]
amiki-math = { workspace = true }
amiki-scene = { workspace = true }
amiki-raster = { workspace = true }
amiki-gpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

[dev-dependencies]
image = { workspace = true }
winit = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
# 文本层仅示例/测试需要；门面 amiki 本身仍不依赖它，
# 故 amiki-math/scene/raster/gpu 的"核心零依赖"性质不受影响。
amiki-text = { path = "../amiki-text" }
amiki-layout = { path = "../amiki-layout" }

# 四个示例都用了 GPU 后端（`window_demo` / `headless_png` / `mipmap_perf` 直接调
# `amiki_gpu`，`mipmap_demo` 走门面的 `render_to_rgba`），所以纯 CPU 构建
# （`--no-default-features`）下不该被编译。用 `required-features` 声明依赖，
# cargo 会自动跳过它们 —— 比在示例里堆 `#[cfg]` 清楚得多。
[[example]]
name = "headless_png"
required-features = ["gpu"]

[[example]]
name = "window_demo"
required-features = ["gpu"]

[[example]]
name = "mipmap_demo"
required-features = ["gpu"]

[[example]]
name = "mipmap_perf"
required-features = ["gpu"]
