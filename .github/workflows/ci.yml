# 最小 CI：把"人记得跑"变成"机器必跑"。
#
# 为什么只有这两个 job 就够（对应本轮评估里最大的风险 —— 验证面窄）：
#   1. `test`   —— 单元/集成/文档测试 + clippy + rustdoc + wasm 纯 CPU 构建。
#                  这三条是仓库既有的"零告警"门禁，此前只存在于交接文档的纪律里。
#   2. `c-abi`  —— `verify.cmd` 五项：header 按 C 与 C++ /W4 /WX 编译、符号核对
#                  （90 声明 / 90 导出）、版本一致性、三个绑定示例**逐字节一致**。
#                  这条是最强的封送检查，此前同样只能靠人手动跑。
#
# 两条都跑在 **windows-latest**：这是本项目的主平台（MSVC + Vulkan/DX12）、
# 也是 `verify.cmd` 唯一被验证过的环境。runner 上没有 GPU 适配器，
# 需要 GPU 的测试会自行跳过（`gpu()` 返回 None 即 return），CPU 路径照常覆盖。
#
# ⚠️ 两个已知前提，若在 runner 上不成立会**直接红**（有意如此，不做静默跳过）：
#   - C# 示例的 TargetFramework 是 **net10.0**（当前仍是 preview）⇒ 用
#     `dotnet-quality: preview` 装 SDK。装不到就红 —— 因为 C# 示例是"别的语言
#     真能调进来"的证据，静默跳过等于把这半条证据丢掉。
#   - `verify.cmd` 需要 MSVC（`vcvars64.bat`）；windows-latest 自带 VS Build Tools。
#
# ⚠️ 本仓库当前**没有配置 remote**，所以这份 workflow 要等推送到 GitHub 才真正开始跑；
# 在那之前它的作用是**把门禁写成可执行清单**（本地照着跑等价）。
#
# Linux / macOS 的编译检查是下一步的自然扩展，但本机无法验证其依赖是否齐备，
# 所以没有写进来 —— 与其加一条"可能因为环境而红"的 gate，不如等有人能验证时再加。

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: tests / clippy / rustdoc / wasm
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具链（含 clippy 与 wasm 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo clippy（零告警）
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo doc（零告警）
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # 特性矩阵：这一条是加 CI 时**立刻抓到问题**的地方 —— `amiki-capi` 的
      # `--no-default-features` 下测试目标此前编不过（codec 测试没有 cfg 门控），
      # 而在此之前大家只构建过 lib，所以没人发现。
      - name: 特性矩阵（capi 的四种组合，含测试目标）
        run: |
          cargo clippy -p amiki-capi --no-default-features --all-targets -- -D warnings
          cargo clippy -p amiki-capi --no-default-features --features codec --all-targets -- -D warnings
          cargo clippy -p amiki-capi --no-default-features --features gpu --all-targets -- -D warnings
          cargo test -p amiki-capi --no-default-features
          cargo test -p amiki-capi --no-default-features --features codec

      # 纯 CPU 的 wasm 构建：这是 WASM 交付物的形状（关掉 gpu + codec）
      - name: wasm 纯 CPU 构建
        run: cargo build -p amiki-capi --profile wasm-release --target wasm32-unknown-unknown --no-default-features

  c-abi:
    name: C ABI（verify.cmd 五项）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 安装 .NET SDK（C# 示例，net10.0 仍是 preview）
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: 安装 Node.js（Node 示例走 koffi，不是 wasm）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: crates\amiki-capi\verify.cmd
        shell: cmd
        run: crates\amiki-capi\verify.cmd
