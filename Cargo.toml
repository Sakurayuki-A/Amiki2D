[workspace]
resolver = "2"
members = [
    "crates/amiki-math",
    "crates/amiki-scene",
    "crates/amiki-raster",
    "crates/amiki-gpu",
    "crates/amiki",
    "crates/amiki-text",
    "crates/amiki-layout",
    "crates/amiki-capi",
    "crates/amiki-codec",
]

[workspace.package]
version = "0.10.9-alpha"
edition = "2021"
# 与仓库根的 LICENSE 文件一致（就是 MIT 单许可）。
# 曾经写成 "MIT OR Apache-2.0" 而仓库里只有 MIT 文本 —— 双许可需要两份完整文本
# 加标准声明，只有一份就算不上双许可。这个一致性由
# `crates/amiki-capi/src/tests/docs_sync.rs` 的 `license_declaration_matches_the_license_file` 钉住。
license = "MIT"

[workspace.dependencies]
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
wgpu = "25"
winit = "0.30"

amiki-math = { path = "crates/amiki-math" }
amiki-scene = { path = "crates/amiki-scene" }
amiki-raster = { path = "crates/amiki-raster" }
amiki-gpu = { path = "crates/amiki-gpu" }
# 图像编解码：**可选** crate（唯一带第三方依赖的一层）
amiki-codec = { path = "crates/amiki-codec" }

[profile.release]
debug = true
lto = "thin"

# WASM 专用 profile：**不嵌调试信息**。
#
# `[profile.release]` 的 `debug = true` 是为原生 profiling 加的，但在 wasm
# 里它是纯浪费 —— 实测同一个模块：
#
#     带调试信息   11.7 MB
#     不带调试信息  **945.9 KB**     ← 差 12 倍
#
# 体积是 WASM 的第一约束（浏览器要下载它），所以单独给一个 profile：
#
#     cargo build --profile wasm-release --target wasm32-unknown-unknown --no-default-features
#
# `opt-level = "z"` 偏尺寸、`lto = "fat"` 跨 crate 内联后能删掉更多死代码、
# `panic = "abort"` 去掉展开表 —— 三条都是标准的 wasm 瘦身手段。
#
# 这个数字归这里管，改动结构后要及时复测（数字来源：上面那条命令的产物字节数）：
#
#     0.10.9 发布时      **1 033.2 KB**  （1 058 046 字节）
#     模块化拆分之后     **1 037.3 KB**  （1 062 229 字节）  ← 拆 2 000 行级 lib.rs 的实测代价
#
# 拆分本身 +4.1 KB（+0.4%）：把代码挪到别的模块会改变内联与死代码删除的判定，
# 这是结构性整理的真实成本，记录在此以免下次复测时以为是回归。
[profile.wasm-release]
inherits = "release"
debug = false
opt-level = "z"
lto = "fat"
panic = "abort"
