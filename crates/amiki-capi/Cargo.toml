[package]
name = "amiki-capi"
description = "Amiki2D 的 C ABI（手写 header 契约见 include/amiki.h）"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# `staticlib` 给 C 直接链接；`cdylib` 给需要动态库的场景；
# `rlib` 让本仓库的 Rust 测试能直接用这些函数（ABI 层自测）。
name = "amiki2d"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["gpu", "codec"]

# GPU 路径。**WASM 构建请关掉它**：
#
#     cargo build -p amiki-capi --target wasm32-unknown-unknown --release --no-default-features
#
# 实测差别很大：带 wgpu 的 wasm 模块 **23 MB**，纯 CPU 只有它的零头。
# 关掉之后 `AMIKI_BACKEND_AUTO` 会落到 CPU，`AMIKI_BACKEND_GPU` 返回
# `AMIKI_ERROR_BACKEND_UNAVAILABLE` —— 都是**显式行为**，不是静默降级。
gpu = ["dep:amiki-gpu", "dep:pollster", "amiki/gpu"]

# 图像编解码（0.10.0）：PNG 解码/编码 + JPEG 解码。
#
# **默认开，但要能关**：native 默认带上（C 调用方随时能读图）；wasm 构建走
# `--no-default-features`，于是**不启用 ⇒ 模块体积一分不涨**（实测编解码给 wasm
# 带 +166 KB ~ +283 KB 量级，见 CHANGELOG 0.10.0）。注意关掉后少导出 3 个符号，
# 而 `verify.cmd` 的"header 声明 = 实际导出"只对**默认配置**（native）负责。
codec = ["dep:amiki-codec"]

[dependencies]
amiki = { path = "../amiki", default-features = false }
amiki-codec = { workspace = true, optional = true }
amiki-gpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
amiki-math = { workspace = true }
amiki-scene = { workspace = true }
amiki-text = { path = "../amiki-text" }
amiki-raster = { workspace = true }
amiki-layout = { path = "../amiki-layout" }
