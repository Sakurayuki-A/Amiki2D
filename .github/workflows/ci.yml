# 最小 CI：把"人记得跑"变成"机器必跑"。
#
# 为什么只有这两个 job 就够（对应本轮评估里最大的风险 —— 验证面窄）：
#   1. `test`   —— 单元/集成/文档测试 + clippy + rustdoc + wasm 纯 CPU 构建。
#                  这三条是仓库既有的"零告警"门禁，此前只存在于交接文档的纪律里。
#   2. `c-abi`  —— `verify.cmd` 五项：header 按 C 与 C++ /W4 /WX 编译、符号核对
#                  （90 声明 / 90 导出）、版本一致性、三个绑定示例**逐字节一致**。
#                  这条是最强的封送检查，此前同样只能靠人手动跑。
#
# 两个 job 的**步骤本体不写在这里**，而是调用 `tools/ci-*.cmd` —— 这样 CI 与本地
# 跑的是同一份清单，不会各自漂移（本地等价命令：`tools\ci-test.cmd`、
# `tools\ci-cabi.cmd`）。本文件只负责"runner 上装什么工具链"。
#
# 两条都跑在 **windows-latest**：这是本项目的主平台（MSVC + Vulkan/DX12）、
# 也是 `verify.cmd` 唯一被验证过的环境。runner 上没有 GPU 适配器，
# 需要 GPU 的测试会自行跳过（`gpu()` 返回 None 即 return），CPU 路径照常覆盖。
# 想在本地复现"没有 GPU"这一条：`set AMIKI_BACKENDS=bogus` 再跑 ci-test.cmd。
#
# ⚠️ 两个已知前提，若在 runner 上不成立会**直接红**（有意如此，不做静默跳过）：
#   - C# 示例的 TargetFramework 是 **net10.0**（当前仍是 preview）⇒ 用
#     `dotnet-quality: preview` 装 SDK。装不到就红 —— 因为 C# 示例是"别的语言
#     真能调进来"的证据，静默跳过等于把这半条证据丢掉。
#   - `verify.cmd` 需要 MSVC（`vcvars64.bat`）；windows-latest 自带 VS Build Tools。
#
# ⚠️ 本仓库当前**没有配置 remote**，所以这份 workflow 要等推送到 GitHub 才真正开始跑；
# 在那之前它的作用是**把门禁写成可执行清单**（`tools/ci-*.cmd` 本地跑等价）。
#
# 本地与 runner 仍有两点差异，且都是**工具链版本**层面的：
#   - runner 用 `stable`，本机也大概率是 stable，但两者日期可能不同 —— 仓库没有
#     `rust-toolchain.toml`，所以这一点没有被固定（要不要固定是个决策，见 HANDOFF）。
#   - runner 是冷缓存（`target/` 为空、cargo 依赖全量下载）：本地复现用
#     `cargo clean` + 全新克隆即可。
#
# Linux / macOS 的编译检查是下一步的自然扩展，但本机无法验证其依赖是否齐备，
# 所以没有写进来 —— 与其加一条"可能因为环境而红"的 gate，不如等有人能验证时再加。

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: tests / clippy / rustdoc / wasm
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具链（含 clippy 与 wasm 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: tools\ci-test.cmd（本地同一条命令）
        shell: cmd
        run: tools\ci-test.cmd

  c-abi:
    name: C ABI（verify.cmd 五项）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: 安装 .NET SDK（C# 示例，net10.0 仍是 preview）
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: 安装 Node.js（Node 示例走 koffi，不是 wasm）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: tools\ci-cabi.cmd（本地同一条命令）
        shell: cmd
        run: tools\ci-cabi.cmd

